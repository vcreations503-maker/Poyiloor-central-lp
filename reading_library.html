<style>
*{box-sizing:border-box}
:root{--green:#176b49;--dark:#143e2d;--light:#f2f9f4}
body{margin:0;background:#edf5ef;color:var(--dark);font-family:"Noto Sans Malayalam",sans-serif}
header{background:linear-gradient(115deg,#125139,#23845d);color:white;text-align:center;padding:25px 12px 38px}
header h1{font-size:clamp(25px,5vw,39px);margin:12px 0}
header p{margin:8px}
main{max-width:1100px;margin:30px auto;padding:0 15px}
.page{background:white;border-radius:22px;padding:25px;box-shadow:0 6px 22px #0000000a}
h2{font-size:24px}
button{font-family:inherit;cursor:pointer}
.back{background:var(--green);color:white;border:0;border-radius:11px;padding:11px 18px;margin-bottom:20px}
.choice-grid,.class-grid,.card-grid,.writer-grid{display:grid;gap:15px}
.choice-grid{grid-template-columns:repeat(2,1fr)}
.class-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
.card-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
.writer-grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.choice,.class-choice,.mini-card{border:2px solid #d0e9d8;background:#f5fbf6;border-radius:19px;padding:24px 12px;text-align:center;color:var(--dark)}
.choice{padding:30px 14px}
.choice strong,.class-choice strong,.mini-card strong{display:block;margin:10px 0 5px}
.choice small,.mini-card small{display:block;color:#60786b}
.emoji{display:block;font-size:42px}
.choice:hover,.class-choice:hover,.mini-card:hover{border-color:var(--green);background:#eaf7ed}
.story{max-width:800px;margin:auto}
.story h2{text-align:center}
.sentence{display:block;width:100%;background:#f2f9f3;border:1px solid #dcece0;border-radius:12px;padding:15px;margin:10px 0;text-align:left;font-size:17px;line-height:2;color:#173e2d}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.actions button{background:var(--green);border:0;color:white;padding:12px 16px;border-radius:10px}
.writer{border:1px solid #dce9df;border-radius:17px;overflow:hidden;background:#fff}
.portrait{height:185px;background:#e7f0e9;display:flex;align-items:center;justify-content:center;font-size:50px}
.portrait img{width:100%;height:100%;object-fit:cover}
.writer-content{padding:15px}
.writer-content h3{margin:0 0 8px;font-size:18px}
.writer-content p{font-size:13px;line-height:1.9}
.writer details{background:#f1f7f2;border-radius:10px;padding:10px;font-size:13px}
.writer summary{cursor:pointer;font-weight:700}
.writer a{font-size:11px;color:var(--green)}
.note{font-size:13px;color:#6c7b70}
footer{text-align:center;background:#123e2d;color:white;padding:24px;margin-top:35px}
@media(max-width:600px){
main{margin:15px auto}
.page{padding:15px}
.choice-grid{grid-template-columns:1fr}
.card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini-card{padding:20px 8px}
.mini-card strong{font-size:13px}
.writer-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.writer-content{padding:10px}
.writer-content h3{font-size:14px}
.portrait{height:150px}
}
</style>
</head>

function stopAudio(){
if("speechSynthesis" in window) speechSynthesis.cancel();
}

function speak(text,rate=0.9){
if(!("speechSynthesis" in window)){
alert("ഈ ഉപകരണത്തിൽ ശബ്ദ സൗകര്യം ലഭ്യമല്ല.");
return;
}
stopAudio();
const utterance=new SpeechSynthesisUtterance(text);
utterance.lang="ml-IN";
utterance.rate=rate;
const voices=speechSynthesis.getVoices();
const voice=voices.find(v=>v.lang.toLowerCase().startsWith("ml"));
if(voice) utterance.voice=voice;
speechSynthesis.speak(utterance);
}

function el(tag,className,text){
const e=document.createElement(tag);
if(className)e.className=className;
if(text!==undefined)e.textContent=text;
return e;
}

stopAudio();
app.replaceChildren();

const b=el("button","back",label);

function cardList(cls){
clear();

app.appendChild(backButton("← Change Class",classPage));
app.appendChild(el("h2","","Class "+cls+" - Reading Cards 1 to 20"));

const grid=el("div","card-grid");

stories[cls].forEach((story,i)=>{
const b=el("button","mini-card");
b.append(
el("span","emoji",story.emoji),
el("strong","","Reading Card "+(i+1)),
el("small","",story.title)
);
b.onclick=()=>openCard(cls,i);
grid.appendChild(b);
});
app.appendChild(grid);
}

function openCard(cls,index){
clear();
selectedClass=cls;
selectedCard=index;
const story=stories[cls][index];

app.appendChild(backButton("← Back to Reading Cards",()=>cardList(cls)));

const article=el("article","story");
article.appendChild(el("h2","",story.emoji+" "+story.title));
article.appendChild(el("p","note","Class "+cls+" • Reading Card "+(index+1)));

story.lines.forEach(line=>{
const b=el("button","sentence","🔊  "+line);
b.onclick=()=>speak(line);
article.appendChild(b);
});

const actions=el("div","actions");
const options=[
["▶ Listen",()=>speak(story.lines.join(" "))],
["🐢 Read Slowly",()=>speak(story.lines.join(" "),0.7)],
["■ Stop",stopAudio],
["← Previous",()=>openCard(cls,(index+19)%20)],
["Next Card →",()=>openCard(cls,(index+1)%20)]
];

options.forEach(([label,action])=>{
const b=el("button","",label);
b.onclick=action;
actions.appendChild(b);
});
article.appendChild(actions);
app.appendChild(article);
}

function loadPortrait(container,index){
const title=wikiTitles[index];
const url="https://en.wikipedia.org/w/api.php?"+
"action=query&prop=pageimages&piprop=thumbnail"+
"&pithumbsize=400&format=json&origin=*"+
"&titles="+encodeURIComponent(title);

fetch(url)
.then(r=>{
if(!r.ok)throw Error("Image unavailable");
return r.json();
})
.then(data=>{
const pages=Object.values(data.query?.pages||{});
const src=pages[0]?.thumbnail?.source;
if(!src)return;
const img=new Image();
img.alt=writers[index][0];
img.loading="lazy";
img.onload=()=>container.replaceChildren(img);
img.onerror=()=>{};
img.src=src;
})
.catch(()=>{});
}
