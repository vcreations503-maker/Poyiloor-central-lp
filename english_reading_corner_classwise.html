We drew a simple model showing water flowing from a roof into a tank. The project encouraged us to conserve water."}, {"id": "c5-15", "grade": 5, "title": "The Brave Little Rescue", "emoji": "🐈", "text": "A kitten became trapped behind a garden fence. The children informed an adult instead of trying anything dangerous. With careful help, the kitten was brought to safety."}, {"id": "c5-16", "grade": 5, "title": "Why Exercise Matters", "emoji": "🏃", "text": "Regular physical activity helps keep our bodies strong. Walking, running and playing outdoor games are enjoyable ways to move. Rest and healthy food are important too."}, {"id": "c5-17", "grade": 5, "title": "An Unexpected Visitor", "emoji": "🦜", "text": "One morning, a colourful bird landed near our classroom window. We watched quietly without disturbing it. Later, we used a field guide to learn about birds."}, {"id": "c5-18", "grade": 5, "title": "The School Exhibition", "emoji": "🖼️", "text": "Students displayed models, drawings and science experiments at the exhibition. Visitors asked questions about each project. Explaining our work made us more confident."}, {"id": "c5-19", "grade": 5, "title": "The Gift of Friendship", "emoji": "🫶", "text": "A new student joined our class in the middle of the year. We invited her to play and showed her around the school. Soon she felt welcome and made many friends."}, {"id": "c5-20", "grade": 5, "title": "Dreams for the Future", "emoji": "🚀", "text": "Our teacher asked us to describe our dreams for the future. Some students wanted to become doctors, artists or scientists. We learned that effort and curiosity help us move towards our goals."}];
let grade=null,selected=null;const $=id=>document.getElementById(id);
function stopAudio(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function speak(text,rate){if(!('speechSynthesis' in window)){$('status').textContent='Audio is unavailable in this browser.';return}stopAudio();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=rate;u.onstart=()=>$('status').textContent='Playing audio...';u.onend=()=>$('status').textContent='Tap a word to listen again.';u.onerror=()=>$('status').textContent='Could not play audio. Check sound and speech settings.';speechSynthesis.speak(u)}
function renderClasses(){
 $('classes').replaceChildren();
 for(let i=1;i<=5;i++){
  const b=document.createElement('button');
  b.innerHTML='Class '+i+'<br><small>20 Cards</small>';
  b.className=grade===i?'active':'';
  b.onclick=()=>{stopAudio();grade=i;selected=null;renderClasses();renderCards();$('cardSection').hidden=false;$('reader').hidden=true;$('cardSection').scrollIntoView({behavior:'smooth',block:'start'})};
  $('classes').append(b)
 }
}
function renderCards(){
 $('classHeading').textContent='Class '+grade+' — Reading Cards 1 to 20';
 $('cards').replaceChildren();
 CARDS.filter(c=>c.grade===grade).forEach((c,index)=>{
  const b=document.createElement('button');b.className='card';
  const e=document.createElement('span');e.className='emoji';e.textContent=c.emoji;
  const t=document.createElement('strong');t.textContent='Reading Card '+(index+1);
  const d=document.createElement('small');d.textContent=c.title;
  b.append(e,t,d);
  b.onclick=()=>{stopAudio();selected=c.id;renderReader();$('reader').hidden=false;$('reader').scrollIntoView({behavior:'smooth',block:'start'})};
  $('cards').append(b)
 })
}
function renderReader(){
 const c=CARDS.find(x=>x.id===selected);if(!c)return;
 $('title').textContent=c.emoji+' '+c.title;
 $('cardinfo').textContent='Class '+c.grade+' · Reading Card '+Number(c.id.slice(-2));
 $('words').replaceChildren();
 for(const word of c.text.match(/\\S+/g)||[]){
  const b=document.createElement('button');b.className='word';b.textContent=word;b.title='Listen to '+word;b.onclick=()=>speak(word,0.8);$('words').append(b)
 }
 $('status').textContent='Tap any word to listen.'
}
function backToCards(){stopAudio();$('reader').hidden=true;$('cardSection').scrollIntoView({behavior:'smooth'})}
function backToClasses(){stopAudio();grade=null;selected=null;$('cardSection').hidden=true;$('reader').hidden=true;renderClasses();$('classes').scrollIntoView({behavior:'smooth'})}
function readCard(rate){speak(CARDS.find(c=>c.id===selected).text,rate)}
renderClasses();
</script></body></html>
