<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f7f2;color:#173d2e;font-family:Arial,sans-serif}
header{background:linear-gradient(120deg,#104d35,#248456);color:white;text-align:center;padding:26px 12px}
header h1{font-size:28px;margin:10px 0}
header p{margin:6px}
main{max-width:1000px;margin:auto;padding:15px}
section{background:white;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 4px 18px #173d2e15}
h2{font-size:23px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.classBtn,.cardBtn{background:#f6fcf7;border:2px solid #d3e9d9;border-radius:15px;padding:20px 10px;color:#173d2e;cursor:pointer}
.classBtn{font-size:21px;font-weight:bold}
.cardBtn{min-height:140px}
.cardBtn strong{display:block;margin:8px 0}
.cardBtn small{color:#526a5b}
.emoji{font-size:40px;display:block}
button{font-family:inherit}
.action{background:#176b48;color:white;border:0;border-radius:10px;padding:13px 17px;margin:5px;cursor:pointer;font-size:15px}
.words{line-height:2.5}
.word{background:#eef8ef;border:1px solid #b8dfc4;border-radius:9px;padding:8px 10px;margin:4px;font-size:23px;color:#143d2a;cursor:pointer}
.word:focus,.word:hover{background:#c9eed3}
.line{padding:9px 0;border-bottom:1px solid #edf2ed}
.muted{color:#587264}
[hidden]{display:none!important}
#reader{scroll-margin-top:15px}
</style>
</head>
<body>
<header>
<strong>POYILOOR CENTRAL LP SCHOOL</strong>
<h1>📚 English Reading Corner</h1>
<p>Read • Listen • Learn</p>
</header>
<main>
<section id="home">
<h2>Choose Your Class</h2>
<div id="classes" class="classes"></div>
</section>
<section id="library" hidden>
<button class="action" onclick="showHome()">← Change Class</button>
<h2 id="classTitle"></h2>
<div id="cards" class="cards"></div>
</section>
<section id="reader" hidden>
<button class="action" onclick="showLibrary()">← All Reading Cards</button>
<h2 id="readingTitle"></h2>
<p id="cardInfo" class="muted"></p>
<div id="readingText"></div>
<p>
<button class="action" onclick="readAll(0.9)">🔊 Read All</button>
<button class="action" onclick="readAll(0.6)">🐢 Read Slowly</button>
<button class="action" onclick="stopAudio()">■ Stop</button>
</p>
<p id="status" class="muted">Tap a word to hear it.</p>
</section>
</main>

function makeLines(grade,item){
const [emoji,title,thing,quality,place]=item;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
if(grade===1)return [
"This is a "+thing+".",
"The "+thing+" is "+quality+".",
"I can see the "+thing+".",
"It is in the "+place+".",
"I look at it.",
"I like the "+thing+".",
"I can say its name.",
"I can draw it.",
"I can talk about it.",
"I am happy today."
];
if(grade===2)return [
"Today I see a "+thing+".",
"It is very "+quality+".",
"I find it near the "+place+".",
"I look at it carefully.",
"I tell my friend about it.",
"My friend comes to see it.",
"We talk about the "+thing+".",
"We learn something new.",
"We enjoy our time together.",
"It is a happy day for us."
];
if(grade===3)return [
"One morning I learned about "+thing+".",
"Our teacher told us a short story.",
"The story was interesting to hear.",
"We talked about the "+quality+" things around us.",
"I remembered the "+place+" near my home.",
"My friends shared their ideas.",
"We asked many simple questions.",
"Our teacher helped us find answers.",
"I wrote a few sentences in my notebook.",
"I wanted to learn more the next day."
];
if(grade===4)return [
"Today our class discussed "+title.toLowerCase()+".",
"Our teacher explained why this topic matters.",
"We listened carefully and shared our ideas.",
"I thought about the things we see every day.",
"We talked about the "+place+" and our surroundings.",
"Each student gave a different example.",
"We learned to ask questions and find answers.",
"Working together made the lesson interesting.",
"I wrote down the important points in my notebook.",
"I decided to use what I learned in daily life."
];
return [
"During our English lesson, we discussed "+title.toLowerCase()+".",
"Our teacher encouraged everyone to share an opinion.",
"At first, I was unsure what I should say.",
"Then I remembered an experience from my own life.",
"I explained my idea clearly to the other students.",
"My friends listened and asked thoughtful questions.",
"We discovered that different people have different experiences.",
"The discussion helped us understand the topic better.",
"I wrote a short paragraph about what I had learned.",
"By the end of the lesson, I felt more confident."
];
}

const CARDS=[];
topics.forEach((group,index)=>{
group.forEach((item,i)=>{
CARDS.push({
grade:index+1,
number:i+1,
emoji:item[0],
title:item[1],
lines:makeLines(index+1,item)
});
});
});

let currentGrade=0;
let currentCard=null;
const $=id=>document.getElementById(id);

function stopAudio(){
if("speechSynthesis" in window){
speechSynthesis.cancel();
}
}

function speak(text,rate=0.85){
if(!("speechSynthesis" in window)){
$("status").textContent="Audio is not supported.";
return;
}
stopAudio();
const voice=new SpeechSynthesisUtterance(text);
voice.lang="en-IN";
voice.rate=rate;
voice.onstart=()=>{$("status").textContent="Reading...";};
voice.onend=()=>{$("status").textContent="Tap a word to listen again.";};
voice.onerror=()=>{$("status").textContent="Please check audio settings.";};
speechSynthesis.speak(voice);
}

function showHome(){
stopAudio();
$("library").hidden=true;
$("reader").hidden=true;
$("home").hidden=false;
window.scrollTo(0,0);
}

function showLibrary(){
stopAudio();
$("home").hidden=true;
$("reader").hidden=true;
$("library").hidden=false;
$("classTitle").textContent="Class "+currentGrade+" - Reading Cards 1 to 20";
const box=$("cards");
box.replaceChildren();
CARDS.filter(c=>c.grade===currentGrade).forEach(c=>{
const btn=document.createElement("button");
btn.className="cardBtn";
const icon=document.createElement("span");
icon.className="emoji";
icon.textContent=c.emoji;
const name=document.createElement("strong");
name.textContent="Reading Card "+c.number;
const sub=document.createElement("small");
sub.textContent=c.title;
btn.append(icon,name,sub);
btn.onclick=()=>openCard(c);
box.append(btn);
});
window.scrollTo(0,0);
}

function openCard(card){
stopAudio();
currentCard=card;
$("reader").hidden=false;
$("library").hidden=true;
$("readingTitle").textContent=card.emoji+" "+card.title;
$("cardInfo").textContent="Class "+card.grade+" | Reading Card "+card.number;
const area=$("readingText");
area.replaceChildren();
card.lines.forEach((sentence,index)=>{
const line=document.createElement("div");
line.className="line";
const number=document.createElement("span");
number.className="muted";
number.textContent=(index+1)+". ";
line.append(number);
String(sentence).trim().split(/\s+/).forEach(word=>{
const btn=document.createElement("button");
btn.className="word";
btn.textContent=word;
btn.onclick=()=>speak(word,0.8);
line.append(btn);
});
area.append(line);
});
$("status").textContent="Tap any word to listen.";
window.scrollTo(0,0);
}

function readAll(rate){
if(currentCard){
speak(currentCard.lines.join(" "),rate);
}
}

const classes=$("classes");
for(let i=1;i<=5;i++){
const btn=document.createElement("button");
btn.className="classBtn";
btn.textContent="Class "+i+" 📚";
btn.onclick=()=>{
currentGrade=i;
showLibrary();
};
classes.append(btn);
}
